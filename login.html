<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no grupo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #efeae2;
        }

        .login {
            width: 100%;
            max-width: 390px;
            padding: 35px 28px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .09);
            text-align: center;
        }

        .icone {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #d9fdd3;
            color: #008f72;
            font-size: 30px;
        }

        h1 {
            color: #111b21;
            font-size: 25px;
            margin-bottom: 9px;
        }

        p {
            color: #667781;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border: 1px solid #d9dfe3;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            margin-bottom: 13px;
        }

        input:focus {
            border-color: #00a884;
            box-shadow: 0 0 0 2px rgba(0, 168, 132, .12);
        }

        button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 9px;
            background: #00a884;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #008f72;
        }

        @media (max-width: 420px) {
            .login {
                padding: 30px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="login">
        <div class="icone">✉</div>
        <h1>Entrar no grupo</h1>
        <p>Digite seu nome para participar da conversa.</p>

        <form id="formLogin">
            <input
                type="text"
                id="nomeLogin"
                placeholder="Como você quer ser chamado?"
                maxlength="25"
                autocomplete="off"
                required
            >
            <button type="submit">Entrar no grupo</button>
        </form>
    </main>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(event) {
            event.preventDefault();

            const nome = document.getElementById('nomeLogin').value.trim();

            if (!nome) {
                return;
            }

            // Guarda o nome somente nesta aba/sessão, sem banco de dados.
            sessionStorage.setItem('nomeChat', nome);
            window.location.href = '/';
        });
    </script>
</body>
</html>
